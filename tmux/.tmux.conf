# =============================================================================
# Cross-platform tmux configuration
# macOS: uses pbcopy | Linux: uses xclip/wl-copy | WSL: uses clip.exe
# =============================================================================

# ---------- General ----------
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-features ",*256col*:RGB"
set-option -g mouse on
set-option -g base-index 1
set-option -g renumber-windows on
set-option -g set-titles on
set-option -g history-limit 10000

# ---------- Vi-mode copy/paste (cross-platform clipboard) ----------
set-window-option -g mode-keys vi

# Enter copy mode: Option + c
bind -n M-c copy-mode

# Visual selection (vim-style)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy to system clipboard — auto-detects platform
if-shell 'test "$(uname -s)" = "Darwin"' {
    # macOS: use pbcopy
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    # Linux/WSL: try wl-copy → xclip → clip.exe
    if-shell 'command -v wl-copy >/dev/null 2>&1' {
        bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
    } {
        if-shell 'command -v xclip >/dev/null 2>&1' {
            bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
        } {
            # WSL: Windows clipboard
            if-shell 'command -v clip.exe >/dev/null 2>&1' {
                bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
            }
        }
    }
}

# Cancel / exit copy mode
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Scroll in copy mode: Option + k/j
bind-key -T copy-mode-vi M-k send-keys -X scroll-up
bind-key -T copy-mode-vi M-j send-keys -X scroll-down

# ---------- Pane navigation (Option + number) ----------
bind -n M-1 select-pane -t 0
bind -n M-2 select-pane -t 1
bind -n M-3 select-pane -t 2

# ---------- Split panes (vim-style) ----------
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M--  split-window -v -c "#{pane_current_path}"

# ---------- Reload config ----------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------- Escape time (fix vim/nvim delay) ----------
set-option -sg escape-time 10

# ---------- 24-bit color ----------
set-option -ga terminal-features ",*:RGB"
