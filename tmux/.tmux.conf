# =============================================================================
# Cross-platform tmux configuration
# macOS: uses pbcopy | Linux: uses xclip/wl-copy | WSL: uses clip.exe
# =============================================================================

# ---------- General ----------
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-features ",*256col*:RGB"
set-option -g mouse on

# OSC 52 clipboard passthrough to outer terminal (this is what makes
# SSH clipboard work: serverside yank → OSC 52 escape → local clipboard)
# "on" = accept OSC 52 from apps AND forward to outer terminal
set -s set-clipboard on
set-option -g base-index 1
set-option -g renumber-windows on
set-option -g set-titles on
set-option -g history-limit 10000

# ---------- Vi-mode copy/paste (cross-platform clipboard) ----------
set-window-option -g mode-keys vi

# Enter copy mode: Option + c  (prefix + [ also works as default)
bind -n M-c copy-mode

# Visual selection (vim-style)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy to system clipboard — auto-detects platform
# With "set -s set-clipboard on", tmux also sends via OSC 52 to outer
# terminal, which is what makes SSH clipboard work.
if-shell 'test "$(uname -s)" = "Darwin"' {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    if-shell 'command -v wl-copy >/dev/null 2>&1' {
        bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
    } {
        if-shell 'command -v xclip >/dev/null 2>&1' {
            bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
        } {
            if-shell 'command -v clip.exe >/dev/null 2>&1' {
                bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
            } {
                # Fallback: no clipboard tool found → pipe to cat
                # tmux's set-clipboard handles the OSC 52 forwarding
                bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "cat"
            }
        }
    }
}

# Cancel / exit copy mode
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Scroll in copy mode: Option + k/j
bind-key -T copy-mode-vi M-k send-keys -X scroll-up
bind-key -T copy-mode-vi M-j send-keys -X scroll-down

# ---------- Pane navigation ----------
# Ctrl + number: works everywhere — macOS, Linux, SSH, no terminal config needed
bind -n C-1 select-pane -t 0
bind -n C-2 select-pane -t 1
bind -n C-3 select-pane -t 2
bind -n C-4 select-pane -t 3
bind -n C-5 select-pane -t 4
bind -n C-6 select-pane -t 5
bind -n C-7 select-pane -t 6
bind -n C-8 select-pane -t 7
bind -n C-9 select-pane -t 8

# Option/Meta + number: works when terminal sends Meta (use "Esc+" for Option key)
bind -n M-1 select-pane -t 0
bind -n M-2 select-pane -t 1
bind -n M-3 select-pane -t 2
bind -n M-4 select-pane -t 3
bind -n M-5 select-pane -t 4
bind -n M-6 select-pane -t 5
bind -n M-7 select-pane -t 6
bind -n M-8 select-pane -t 7
bind -n M-9 select-pane -t 8

# Prefix + number: always works (Ctrl+b 1, Ctrl+b 2, etc.)
bind 1 select-pane -t 0
bind 2 select-pane -t 1
bind 3 select-pane -t 2
bind 4 select-pane -t 3
bind 5 select-pane -t 4
bind 6 select-pane -t 5
bind 7 select-pane -t 6
bind 8 select-pane -t 7
bind 9 select-pane -t 8

# Prefix + vim-keys: move between panes in any direction
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---------- Split panes (vim-style) ----------
# Direct: Ctrl + \ (horizontal), Ctrl + - (vertical) — works everywhere
bind -n C-\\ split-window -h -c "#{pane_current_path}"
bind -n C--  split-window -v -c "#{pane_current_path}"

# Direct: Option/Meta + \ (horizontal), Option + - (vertical) — macOS local
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M--  split-window -v -c "#{pane_current_path}"

# Prefix: always works as fallback
bind \\ split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"

# ---------- Reload config ----------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------- Escape time (fix vim/nvim delay) ----------
set-option -sg escape-time 10

# ---------- 24-bit color ----------
set-option -ga terminal-features ",*:RGB"
